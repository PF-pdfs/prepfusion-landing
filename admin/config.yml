# Decap CMS config for the banner carousel — the only content this site
# needs a non-technical editing panel for. Everything else on the page is
# still plain static HTML, edited via code as before.
#
# ⚠ base_url below is a PLACEHOLDER. GitHub's OAuth login requires a small
# server-side step (exchanging a code for a token — can't be done from the
# browser alone, GitHub doesn't allow it), so this needs a tiny OAuth proxy
# deployed once. See admin/OAUTH_SETUP.md in this repo for the exact steps —
# it's a ~10-minute one-time setup on Cloudflare Workers' free tier (you're
# already using Cloudflare for DNS, so no new account needed), not something
# that can be done without your GitHub/Cloudflare account access.

backend:
  name: github
  repo: PF-study-hub/prepfusion-landing
  branch: main
  base_url: https://REPLACE-WITH-YOUR-OAUTH-WORKER.workers.dev
  auth_endpoint: auth

# Images uploaded through the CMS land here and get committed to the repo
# alongside everything else — same folder the mentor photos already live in.
media_folder: "assets/img/banners"
public_folder: "assets/img/banners"

collections:
  - name: "banners"
    label: "Homepage Banners"
    files:
      - name: "banners"
        label: "Banner Carousel"
        file: "banners.json"
        description: "The rotating banner strip under the header. Drag rows to reorder — order here is the order they play in."
        fields:
          - { name: "banners", label: "Banners", widget: "list", summary: "{{fields.type}} — {{fields.title}}", fields: [
              { name: "type", label: "Banner style", widget: "select", default: "text",
                hint: "Read admin/HOW_TO_ADD_BANNERS.md once if this is your first time — it explains the two styles with pictures of what each one produces.",
                options: [
                  { label: "Text banner — headline + button, on a plain color or photo background", value: "text" },
                  { label: "Full image banner — your own finished design, shown exactly as you made it", value: "image" }
                ] },
              { name: "title", label: "Headline (Text banner only)", widget: "string", required: false, hint: "Short — this is the big bold line on the slide. Leave blank for a Full image banner." },
              { name: "tag", label: "Small label (Text banner only, optional)", widget: "string", required: false, default: "Admissions open",
                hint: "The small pill above the headline. A few you've used before: \"Admissions open\", \"Free to start\", \"Placements\", \"New batch\". Leave the default, pick one of those, or type your own." },
              { name: "text", label: "Description (Text banner only, optional)", widget: "text", required: false },
              { name: "cta", label: "Button text (Text banner only, optional)", widget: "string", required: false, default: "Learn more",
                hint: "A few you've used before: \"Explore the batch\", \"Browse free courses\", \"See placement courses\". Leave the default, pick one of those, or type your own." },
              { name: "link", label: "Where the whole slide links to", widget: "string", hint: "Full URL, e.g. https://prepfusion.in/new-courses?examId=6" },
              { name: "image", label: "Image", widget: "image", required: false,
                hint: "For a Text banner: an optional photo background (recommended ~1160×380px landscape, it'll be cropped to fit). For a Full image banner: your complete graphic, shown in full without cropping — see HOW_TO_ADD_BANNERS.md for the best size." }
            ] }
