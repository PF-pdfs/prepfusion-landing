# prepfusion.in apex Worker: redirects the bare root to go.prepfusion.in.
#
# See README.md before deploying. The Worker code is the easy part: a route
# only fires for traffic Cloudflare is actually PROXYING, and the apex
# record is DNS-only (grey cloud) today, pointing straight at Vercel. That
# is why the earlier deploy of this same redirect did nothing.
#
# This replaces the "domain-swap bridge" config (wildcard route + static
# assets), which was explicitly NOT safe to deploy: its prepfusion.in/*
# route would have redirected every store URL to courses.prepfusion.in,
# which doesn't exist. That work is still in git history (963262c).

name = "prepfusion-landing-apex"
main = "worker.js"
compatibility_date = "2024-09-23"

# Keeps the isolated test URL (and version preview URLs) available:
# https://prepfusion-landing-apex.prepfusion-edu-gate.workers.dev/
workers_dev = true
preview_urls = true

# EXACT root only, with no wildcard. `prepfusion.in/` matches the bare root
# (with any query string) and nothing else. Every other apex path, and
# every subdomain, never touches this Worker.
#
# The zone's other route (pyq.prepfusion.in/pdf/dl/* -> prepfusion-dl)
# belongs to a different Worker and is not affected by deploying this one.
routes = [
  { pattern = "prepfusion.in/", zone_name = "prepfusion.in" }
]
