# prepfusion.in apex Worker — deploy config
#
# Deployed with `wrangler deploy` from inside this cloudflare/ directory.
# See README.md for the one-time manual setup this assumes already exists
# (this domain is already a Cloudflare zone — see gate_pdfs/cloudflare/README.md
# in the sibling repo for why, and how it was set up).
#
# Redirects the bare homepage ONLY to go.prepfusion.in — not a full same-URL
# serve of the landing page. That was tried three different ways tonight
# (go.prepfusion.in direct, raw.githubusercontent.com, a service-bound
# static-assets project) and all three hit real, reproduced reliability
# problems, always specifically when the Worker had to FETCH content from
# somewhere else. A redirect fetches nothing — see worker.js.
#
# The safety of this whole approach lives in the `routes` list below matching
# ONLY the exact bare path. Every other path on the domain (every
# /new-courses/*, /terms, /test-series, ...) never touches this Worker at
# all and flows straight to Vercel exactly as it does today.

name = "prepfusion-landing-apex"
main = "worker.js"
compatibility_date = "2024-09-23"

# Explicit on purpose: Wrangler defaults this off once custom `routes` are
# present, which silently dropped the workers.dev URL this whole apex change
# has been tested through (isolated from the live domain) — a real deploy
# hit this exact warning mid-troubleshooting. Keeping it on keeps that
# always-available, zero-risk test URL: prepfusion-landing-apex.<your
# account subdomain>.workers.dev.
workers_dev = true

routes = [
  { pattern = "prepfusion.in/", zone_name = "prepfusion.in" }
]
